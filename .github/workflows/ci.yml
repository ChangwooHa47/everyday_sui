name: monorepo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  move-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        id: sui-cache
        with:
          path: .local-tools/sui-linux
          key: sui-testnet-v1.79.0-linux-x64-be99e1e8
      - name: Install pinned Sui CLI
        if: steps.sui-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/MystenLabs/sui/releases/download/testnet-v1.79.0/sui-testnet-v1.79.0-ubuntu-x86_64.tgz -o "$RUNNER_TEMP/sui.tgz"
          echo "be99e1e81c098dd0beb2969d671fb8270ccc0520188ccea60213ae094d32337a  $RUNNER_TEMP/sui.tgz" | sha256sum --check
          mkdir -p .local-tools/sui-linux
          tar -xzf "$RUNNER_TEMP/sui.tgz" -C .local-tools/sui-linux --wildcards --no-anchored sui
          chmod +x .local-tools/sui-linux/sui
      - run: npm run test:move
        env:
          SUI_BIN: .local-tools/sui-linux/sui
  types-build-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node infra/check-docs.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:static
      - run: docker build -f infra/Dockerfile.api -t everyday-api:ci .
  product-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @everyday/contracts
      - name: Verify PostgreSQL migrations and authenticated API flows
        run: node --import tsx infra/test-product.mjs
      - name: Verify single-process container and graceful shutdown
        run: |
          docker build -f infra/Dockerfile.api -t everyday-api:deployment-review .
          docker build --build-arg NEXT_PUBLIC_API_BASE=https://api.example.com -f infra/Dockerfile.web -t everyday-web:deployment-review .
          node infra/smoke-deployment.mjs
